# =============================================================================
# Domain: Payment
# Entity: PaymentEntry (+ PaymentAllocation)
# Description: Settlement of money against invoices. A PaymentEntry records money
# actually moving (receive from a customer, pay a supplier); its PaymentAllocation
# children allocate that money across one-or-many billing invoices (the
# reconciliation). On post it emits ONE balanced settlement AccountingPost —
# receive: Dr Bank · Cr A/R [customer]; pay: Dr A/P [supplier] · Cr Bank — into
# backbone-accounting, and (via PaymentSettled) draws down billing's outstanding.
# All cross-module refs are logical FKs.
# =============================================================================

models:
  - name: PaymentEntry
    collection: payment_entries
    description: "A settlement document; emits a settlement AccountingPost on post"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique payment identifier"

      payment_number:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Human reference (the post's source_reference)"

      branch_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Branch # logical FK to organization.Branch.id"

      payment_type:
        type: PaymentType
        attributes: ["@required"]
        description: "receive (from customer) | pay (to supplier) | internal_transfer"

      party_type:
        type: PaymentPartyType?
        description: "customer | supplier | employee (null for internal_transfer)"

      party_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The settled party # logical FK to party.Party.id (A/R or A/P subledger)"

      posting_date:
        type: date
        attributes: ["@required"]
        description: "Settlement / posting date"

      currency:
        type: string
        attributes: ["@default(\"IDR\")", "@max(3)"]
        description: "ISO currency code"

      mode_of_payment_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "How money moved # logical FK to payment.ModeOfPayment.id"

      method:
        type: PaymentMethod
        attributes: ["@default(manual)"]
        description: "Settlement channel dimension that drives the landing state at post: cash (or a non-reconcilable bank account) lands paid; reconcilable channels land in_flight until the bank confirms"

      provider_txn_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Gateway/provider transaction # logical FK to a future gateway module's transaction (P6 seam; no codecs yet)"

      paid_amount:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Total money moving (the Bank debit on receive / credit on pay)"

      allocated_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Σ of the allocation lines knocked off invoices"

      unallocated_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "paid_amount − allocated_amount (kept on account)"

      bank_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Bank/Cash GL account # logical FK to accounting.Account.id"

      party_account_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "A/R (receive) or A/P (pay) control account # logical FK to accounting.Account.id"

      withholding_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "PPh withheld (0 = no withholding; the settlement post stays 2-line). ADR-003."

      withholding_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "PPh Payable (pay) or PPh Receivable (receive) GL account # logical FK to accounting.Account.id. Required when withholding_amount > 0."

      withholding_tax_type:
        type: WithholdingTaxType
        attributes: ["@default(none)"]
        description: "Which PPh type was withheld. ADR-003."

      status:
        type: PaymentStatus
        attributes: ["@default(draft)"]
        description: "Document lifecycle (the fused state machine — see PaymentStatus below for the transition contract)"

      posting_state:
        type: GlPostingState
        attributes: ["@default(pending)"]
        description: "GL reconciliation state"

      journal_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Resulting journal # logical FK to accounting.Journal.id"

      accounting_post_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The AccountingPost record # logical FK to accounting.AccountingPost.id"

      posted_at:
        type: datetime?
        description: "When the GL post was confirmed"

      reference_no:
        type: string?
        attributes: ["@max(140)"]
        description: "External bank / gateway reference"

      notes:
        type: string?
        attributes: ["@max(1000)"]
        description: "Free-text notes"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      allocations:
        type: PaymentAllocation[]
        attributes: ["@one_to_many"]
        description: "Invoice allocations (the reconciliation)"
        inverse: payment

    indexes:
      - type: unique
        fields: [payment_number]
        where: "deleted_at IS NULL"
      - type: index
        fields: [party_type, party_id, status]
      - type: index
        fields: [posting_state]

  - name: PaymentAllocation
    collection: payment_allocations
    description: "One knock-off of a payment against an invoice (the reconciliation line)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique allocation id"

      payment_id:
        type: uuid
        attributes: ["@required", "@foreign_key(PaymentEntry.id)"]
        description: "Owning payment"

      invoice_ref:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "The settled invoice id (logical — billing sales/purchase invoice)"

      invoice_kind:
        type: SettlementKind
        attributes: ["@required"]
        description: "Which billing invoice table `invoice_ref` points at"

      allocated_amount:
        type: decimal
        attributes: ["@required", "@precision(18,2)", "@non_negative"]
        description: "Amount of this payment knocked off that invoice (the GROSS knock-off; an early-pay discount is separate)"

      discount_amount:
        type: decimal
        attributes: ["@default(0)", "@precision(18,2)", "@non_negative"]
        description: "Early-pay discount taken on this allocation, materialized at post (the decision is stamped, so replays and the mirrored reversal are deterministic — the window is never re-evaluated)"

      discount_account_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "The discount expense/revenue GL account # logical FK to accounting.Account.id. Required when discount_amount > 0."

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

    relations:
      payment:
        type: PaymentEntry
        attributes: ["@one", "@foreign_key(payment_id)"]
        description: "Owning payment"
        inverse: allocations

    indexes:
      - type: index
        fields: [payment_id]
      - type: index
        fields: [invoice_ref, invoice_kind]

# =============================================================================
# Enums (shared across payment)
# =============================================================================

enums:
  - name: PaymentType
    description: "Direction of a payment"
    variants:
      - name: receive
        description: "Money received from a customer (settles A/R)"
        default: true
      - name: pay
        description: "Money paid to a supplier (settles A/P)"
      - name: internal_transfer
        description: "Between own accounts (no party)"

  - name: PaymentPartyType
    description: "Subledger party a payment settles"
    variants:
      - name: customer
        description: "A/R party"
        default: true
      - name: supplier
        description: "A/P party"
      - name: employee
        description: "Employee (advances/reimbursements)"

  - name: PaymentMethod
    description: "Settlement channel — the dimension that decides whether a posted payment awaits bank confirmation"
    variants:
      - name: manual
        description: "Hand-keyed journal settlement (no channel)"
        default: true
      - name: bank_transfer
        description: "Bank transfer — reconcilable when the bank account is"
      - name: cash
        description: "Physical cash — lands paid immediately (no bank statement will confirm it)"
      - name: cheque
        description: "Paper cheque — in flight until it clears"
      - name: gateway
        description: "Electronic gateway (provider_txn_id links the provider's transaction; codecs are a later seam)"

  - name: PaymentStatus
    description: "Fused payment lifecycle. `posting_state` stays the GL-sync truth and owns idempotency; this status is the business state. Transition contract: draft→submitted (submit verb, CAS draft); submitted→in_flight|paid (post_payment computes the landing: cash method or a non-reconcilable bank account ⇒ paid, else in_flight; CAS posting_state=pending AND status IN (draft,submitted)); in_flight→paid (computed drift ONLY via the BankClearanceRecorded consumer, CAS in_flight, no-op from any other state); in_flight|paid→cancelled (reverse_payment, gate status IN (in_flight,paid,cancelled) AND posting_state=posted); submitted→rejected (reject_payment, CAS submitted, terminal — the PRE-settlement stop: a landed payment is exited by reverse, never reject, so no state strands a committed journal). posting_state pending→posted|failed (mark_posted/mark_failed; mark_failed CAS-guarded to pending|failed so a spurious sink error can never overwrite a committed posted) — a GL failure leaves status at submitted, retryable"
    variants:
      - name: draft
        description: "Being prepared; not posted"
        default: true
      - name: submitted
        description: "Submitted; awaiting or mid-posting"
      - name: in_flight
        description: "Posted to the GL; awaiting bank confirmation (the bank account is reconcilable)"
      - name: paid
        description: "Posted to the GL and confirmed (cash, non-reconcilable account, or bank-cleared)"
      - name: cancelled
        description: "Voided (reversed in the GL)"
      - name: rejected
        description: "Refused (terminal) — the operator exit for a payment that must not settle"

  - name: GlPostingState
    description: "GL-posting reconciliation state"
    variants:
      - name: pending
        description: "Not yet posted"
        default: true
      - name: posted
        description: "Confirmed posted"
      - name: failed
        description: "Rejected by accounting"

  - name: SettlementKind
    description: "Which billing invoice an allocation settles"
    variants:
      - name: sales
        description: "Sales invoice (A/R)"
        default: true
      - name: purchase
        description: "Purchase invoice (A/P)"

  - name: WithholdingTaxType
    description: "Indonesian PPh (Pajak Penghasilan) withholding type — ADR-003"
    variants:
      - name: none
        description: "No withholding (default; settlement post stays 2-line)"
        default: true
      - name: pph_22
        description: "PPh 22 — imports / government purchases (1.5–7.5%)"
      - name: pph_23
        description: "PPh 23 — services / rent / royalties (2/10/15%)"
      - name: pph_26
        description: "PPh 26 — non-resident payments (20%)"
